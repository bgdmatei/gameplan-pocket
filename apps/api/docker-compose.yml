# Postgres for local development: `docker compose up -d` from apps/api.
# Dev-only credentials; tests use their own throwaway container.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gameplan
      POSTGRES_PASSWORD: gameplan
      POSTGRES_DB: gameplan
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
