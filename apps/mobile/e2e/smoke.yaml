# Smoke: a game added to the library survives a force-quit (spec criterion 5).
#
# Runs against a Release build, which talks to the staging API:
#   pnpm --filter mobile ios --configuration Release --device "iPhone 17 Pro"
#   maestro --device <simulator id> test apps/mobile/e2e/smoke.yaml
#
# (--device only when a phone is plugged in as well.)
#
# Controls are found by accessibility label, as VoiceOver reads them (T20).
appId: com.bgdmatei.gameplan
name: An added game survives a force-quit
---
- launchApp:
    clearState: true
# The tab bar draws before the app is ready; the chips mean the library is.
- extendedWaitUntil:
    visible: 'Completed'
    timeout: 10000
- tapOn: 'Search, tab.*'
- tapOn: 'Search games'
- inputText: 'Pentiment'
# Staging sleeps when idle and takes up to a minute to wake.
- extendedWaitUntil:
    visible: 'Pentiment, 2022.*'
    timeout: 90000
- tapOn: 'Pentiment, 2022.*'
- tapOn: 'PC \(Microsoft Windows\)'
- tapOn: 'Add to library'
- extendedWaitUntil:
    visible: 'Added to your library.'
    timeout: 10000

# Force-quit and come back: the entry must have reached the database on disk.
- stopApp
- launchApp
# The library opens on Completed; the game was added to the Backlog.
- tapOn: 'Backlog'
- extendedWaitUntil:
    visible: 'Pentiment, PC \(Microsoft Windows\), Backlog'
    timeout: 10000
